<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Emerald Check/Play Button Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Electric Cyan Brackets Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Glassmorphism Card Overlay -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>

    <!-- Ambient Core Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow for Core Icon -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#10B981" flood-opacity="0.25" />
    </filter>

    <!-- Apple iOS / Android Squircle Mask (Smooth Curvature) -->
    <clipPath id="squircleClip">
      <path d="M 512,256 C 512,410.8 410.8,512 256,512 C 101.2,512 0,410.8 0,256 C 0,101.2 101.2,0 256,0 C 410.8,0 512,101.2 512,256 Z" 
            style="d: path('M 0,256 C 0,80 80,0 256,0 C 432,0 512,80 512,256 C 512,432 432,512 256,512 C 80,512 0,432 0,256 Z');" />
    </clipPath>
  </defs>

  <!-- Masked App Icon Container -->
  <g clip-path="url(#squircleClip)">
    <!-- Base Background -->
    <rect width="512" height="512" fill="url(#bgGrad)" />

    <!-- Ambient Radial Background Glows -->
    <circle cx="256" cy="230" r="160" fill="#10B981" opacity="0.15" filter="blur(40px)" />
    <circle cx="380" cy="140" r="100" fill="#06B6D4" opacity="0.12" filter="blur(35px)" />

    <!-- Subtle Grid Background (Automation / Tech Theme) -->
    <path d="M 0,128 H 512 M 0,256 H 512 M 0,384 H 512 M 128,0 V 512 M 256,0 V 512 M 384,0 V 512" 
          stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1.5" stroke-dasharray="4 8" />

    <!-- Center Glassmorphic Hexagon / Shield Backdrop -->
    <rect x="96" y="96" width="320" height="320" rx="48" fill="url(#glassGrad)" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5" />

    <!-- Core Foreground Emblem with Shadow -->
    <g filter="url(#iconShadow)">
      <!-- Left Bracket '<' -->
      <path d="M 172 196 L 128 256 L 172 316" 
            fill="none" stroke="url(#cyanGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Right Bracket '>' -->
      <path d="M 340 196 L 384 256 L 340 316" 
            fill="none" stroke="url(#cyanGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Fused Playwright Checkmark & Execution Arrow (Center Symbol) -->
      <!-- Represents both Test Execution (▶) and Automation Success (✓) -->
      <path d="M 195 262 L 238 305 L 318 200" 
            fill="none" stroke="url(#emeraldGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

      <path d="M 318 200 L 290 200 M 318 200 L 318 228" 
            fill="none" stroke="url(#emeraldGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Top Gloss Highlight Accent -->
    <path d="M 0 0 C 180 0 330 30 512 160 L 512 0 Z" fill="#FFFFFF" opacity="0.025" />
  </g>
</svg>
