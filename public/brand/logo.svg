<!--
  TestKraft app icon: squircle-clipped logo for in-app and web use.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tk-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#070B14"/>
    </linearGradient>
    <linearGradient id="tk-emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="0.45" stop-color="#10B981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="tk-cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="tk-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="tk-glass-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="tk-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="tk-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#10B981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <clipPath id="tk-squircle"><path d="M256 0C460 0 512 52 512 256S460 512 256 512 0 460 0 256 52 0 256 0Z"/></clipPath>
  <g clip-path="url(#tk-squircle)">
  <rect width="512" height="512" fill="url(#tk-bg)"/>

  <!-- Ambient glows -->
  <circle cx="250" cy="270" r="150" fill="#10B981" opacity="0.28" filter="url(#tk-blur)"/>
  <circle cx="390" cy="120" r="90" fill="#06B6D4" opacity="0.25" filter="url(#tk-blur)"/>

  <g transform="translate(256 256) scale(0.9) translate(-256 -256)">
    <!-- Glass tile -->
    <rect x="88" y="88" width="336" height="336" rx="84" fill="url(#tk-glass)" stroke="url(#tk-glass-edge)" stroke-width="2.5"/>
    <path d="M 120 150 Q 150 104 230 98" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="5" stroke-linecap="round"/>

    <g filter="url(#tk-shadow)">
      <!-- { -->
      <path d="M 168 160 C 142 160 138 172 138 196 L 138 230 C 138 246 130 256 112 256 C 130 256 138 266 138 282 L 138 316 C 138 340 142 352 168 352"
            fill="none" stroke="url(#tk-cyan)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- } -->
      <path d="M 344 160 C 370 160 374 172 374 196 L 374 230 C 374 246 382 256 400 256 C 382 256 374 266 374 282 L 374 316 C 374 340 370 352 344 352"
            fill="none" stroke="url(#tk-cyan)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Play triangle (rounded corners via matching stroke) -->
      <path d="M 210 178 L 210 334 L 338 256 Z" fill="url(#tk-emerald)" stroke="url(#tk-emerald)" stroke-width="26" stroke-linejoin="round"/>
      <!-- Check cut into the play button -->
      <path d="M 226 258 L 250 281 L 288 233" fill="none" stroke="#0F172A" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Amber progress spark -->
    <path transform="translate(-36 -20)" d="M 352 132 L 358 148 L 374 154 L 358 160 L 352 176 L 346 160 L 330 154 L 346 148 Z" fill="#F59E0B"/>
  </g>
  </g>
</svg>
